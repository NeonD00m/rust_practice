[package]
name = "palmtree"
version = "0.2.0"
edition = "2024"

[dependencies]
crossterm = { version = "0.29.0", default-features = false, features = ["events", "windows"] }
dirs = "6.0.0"
notify-rust = "4.18.0"
rand = {version = "0.10.2", features = ["thread_rng"]}
serde = {version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
