[package]
name = "butternut"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
graphql_client = { version = "0.10.0", features = ["reqwest-blocking"] }
reqwest = { version = "^0.11", features = ["json", "blocking"] }
serde = "1.0.137"
clap = { version = "^3.0", features = ["derive"] }
openssl = { version = "0.10.40", features = ["vendored"] }
ansi_term = "0.12"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
